<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 580" role="img" aria-label="opencode-auto-guard defense pipeline: every tool call passes through three defensive layers before the agent is allowed to act.">
  <style>
    .box-text { fill: #1f2328; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; }
    .box-sub { fill: #1f2328; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill-opacity: 0.65; }
    .arrow-line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .arrow-head { fill: #57606a; }
    .in-stroke { stroke: #0969da; stroke-width: 1.5; fill: none; }
    .in-fill { fill: #0969da; fill-opacity: 0.07; }
    .l1-stroke { stroke: #d1242f; stroke-width: 1.5; fill: none; }
    .l1-fill { fill: #d1242f; fill-opacity: 0.07; }
    .l2-stroke { stroke: #bf8700; stroke-width: 1.5; fill: none; }
    .l2-fill { fill: #bf8700; fill-opacity: 0.09; }
    .l3a-stroke { stroke: #1a7f37; stroke-width: 1.5; fill: none; }
    .l3a-fill { fill: #1a7f37; fill-opacity: 0.08; }
    .l3b-stroke { stroke: #8250df; stroke-width: 1.5; fill: none; }
    .l3b-fill { fill: #8250df; fill-opacity: 0.08; }
    .out-stroke { stroke: #0969da; stroke-width: 1.5; fill: none; }
    .out-fill { fill: #0969da; fill-opacity: 0.07; }

    @media (prefers-color-scheme: dark) {
      .box-text { fill: #e6edf3; }
      .box-sub { fill: #e6edf3; fill-opacity: 0.7; }
      .arrow-line { stroke: #8b949e; }
      .arrow-head { fill: #8b949e; }
    }
  </style>

  <!-- Input -->
  <rect class="in-stroke" x="80" y="20" width="320" height="50" rx="8"/>
  <rect class="in-fill" x="80" y="20" width="320" height="50" rx="8"/>
  <text class="box-text" x="240" y="42" text-anchor="middle" font-weight="600">Tool call</text>
  <text class="box-sub" x="240" y="60" text-anchor="middle">bash · edit · webfetch · apply_patch · subagent</text>

  <path class="arrow-line" d="M 240 70 L 240 100" marker-end="url(#arrow)"/>

  <!-- Layer 1: Self-protection + hard-deny -->
  <rect class="l1-stroke" x="80" y="100" width="320" height="70" rx="8"/>
  <rect class="l1-fill" x="80" y="100" width="320" height="70" rx="8"/>
  <text class="box-text" x="240" y="128" text-anchor="middle" font-weight="600">Layer 1 · Self-protection + hard-deny</text>
  <text class="box-sub" x="240" y="148" text-anchor="middle">plugin-file writes · pipe-to-shell · encoded PowerShell</text>
  <text class="box-sub" x="240" y="161" text-anchor="middle">rm -rf · find -exec · fork bomb — pure-code, no LLM</text>

  <path class="arrow-line" d="M 240 170 L 240 200" marker-end="url(#arrow)"/>

  <!-- Layer 2: Fast classifier -->
  <rect class="l2-stroke" x="80" y="200" width="320" height="70" rx="8"/>
  <rect class="l2-fill" x="80" y="200" width="320" height="70" rx="8"/>
  <text class="box-text" x="240" y="228" text-anchor="middle" font-weight="600">Layer 2 · Fast classifier</text>
  <text class="box-sub" x="240" y="248" text-anchor="middle">pure-code rules · network egress for curl / ssh / nc</text>
  <text class="box-sub" x="240" y="261" text-anchor="middle">trusted-domain check · no LLM</text>

  <path class="arrow-line" d="M 240 270 L 240 300" marker-end="url(#arrow)"/>

  <!-- Layer 3a: Jev -->
  <rect class="l3a-stroke" x="80" y="300" width="320" height="60" rx="8"/>
  <rect class="l3a-fill" x="80" y="300" width="320" height="60" rx="8"/>
  <text class="box-text" x="240" y="326" text-anchor="middle" font-weight="600">Layer 3a · Jev (optional)</text>
  <text class="box-sub" x="240" y="346" text-anchor="middle">free · ~70–500 ms · typed verdict on ambiguous commands</text>

  <path class="arrow-line" d="M 240 360 L 240 390" marker-end="url(#arrow)"/>

  <!-- Layer 3b: LLM judge -->
  <rect class="l3b-stroke" x="80" y="390" width="320" height="60" rx="8"/>
  <rect class="l3b-fill" x="80" y="390" width="320" height="60" rx="8"/>
  <text class="box-text" x="240" y="416" text-anchor="middle" font-weight="600">Layer 3b · LLM judge (optional)</text>
  <text class="box-sub" x="240" y="436" text-anchor="middle">can deny or keep ask · never promotes ask → allow</text>

  <path class="arrow-line" d="M 240 450 L 240 480" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect class="out-stroke" x="80" y="480" width="320" height="50" rx="8"/>
  <rect class="out-fill" x="80" y="480" width="320" height="50" rx="8"/>
  <text class="box-text" x="240" y="510" text-anchor="middle" font-weight="600">Decision · ALLOW / ASK / DENY</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42E6A4"/>
      <stop offset="100%" stop-color="#7C6CFF"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#050607"/>

  <!-- subtle framing line -->
  <rect x="1" y="1" width="1598" height="518" rx="26" fill="none" stroke="#11161C" stroke-width="2"/>

  <!-- left brand mark -->
  <g transform="translate(285 118)">
    <!-- outer shield -->
    <path d="M120 0
             C165 18 205 28 246 34
             V115
             C246 195 199 250 120 286
             C41 250 -6 195 -6 115
             V34
             C35 28 75 18 120 0Z"
          fill="none" stroke="url(#shieldGrad)" stroke-width="18" stroke-linejoin="round"
          filter="url(#softGlow)"/>

    <!-- terminal chevron -->
    <path d="M56 95 L104 138 L56 181" fill="none" stroke="#F4F6F8" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124 184 H183" fill="none" stroke="#F4F6F8" stroke-width="18" stroke-linecap="round"/>

    <!-- guard bars -->
    <path d="M190 72 V132" stroke="#42E6A4" stroke-width="16" stroke-linecap="round"/>
    <path d="M218 89 V132" stroke="#42E6A4" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- text lockup -->
  <g transform="translate(590 165)">
    <text x="0" y="0"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="58" font-weight="700" fill="#42E6A4"
          letter-spacing="-1.5">OpenCode</text>

    <text x="0" y="72"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="64" font-weight="760" fill="#F4F6F8"
          letter-spacing="-2">Auto Guard</text>

    <text x="3" y="124"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="22" font-weight="500" fill="#8C96A3"
          letter-spacing="0.5">Defensive permissions for autonomous coding agents</text>

    <!-- tiny rule -->
    <rect x="2" y="150" width="410" height="4" rx="2" fill="url(#shieldGrad)" opacity="0.9"/>
  </g>

  <!-- small product stamp -->
  <g transform="translate(1190 404)">
    <circle cx="22" cy="22" r="20" fill="none" stroke="#42E6A4" stroke-width="4"/>
    <path d="M12 22 L20 30 L33 14" fill="none" stroke="#42E6A4" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="29"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="25" font-weight="700" fill="#42E6A4">safe by default</text>
  </g>
</svg>